                            // ➕ ПЛАНОВЫЕ ЛИНИИ (БЕЗ СПРЕДА) — НОВЫЙ БЛОК
                            // =====================================================

                            // 🔵 Плановый ENTRY
                            g.append("line")
                                .attr("x1", xStart)
                                .attr("x2", xEnd)
                                .attr("y1", y(trade.entryPrice))
                                .attr("y2", y(trade.entryPrice))
                                .attr("stroke", "blue")
                                .attr("stroke-width", 1)
                                .attr("stroke-dasharray", "3 3")
                                .attr("opacity", 0.7);

                            // 🟩 Плановый TAKE PROFIT
                            if (hasTP) {
                                g.append("line")
                                    .attr("x1", xStart)
                                    .attr("x2", xEnd)
                                    .attr("y1", y(trade.takeProfit))
                                    .attr("y2", y(trade.takeProfit))
                                    .attr("stroke", "green")
                                    .attr("stroke-width", 1)
                                    .attr("stroke-dasharray", "6 3")
                                    .attr("opacity", 0.6);
                            }

                            // 🟥 Плановый STOP LOSS
                            if (hasSL) {
                                g.append("line")
                                    .attr("x1", xStart)
                                    .attr("x2", xEnd)
                                    .attr("y1", y(trade.stopLoss))
                                    .attr("y2", y(trade.stopLoss))
                                    .attr("stroke", "red")
                                    .attr("stroke-width", 1)
                                    .attr("stroke-dasharray", "6 3")
                                    .attr("opacity", 0.6);
                            }
                        });

                    


                    </script>
                </body>
                </html>
